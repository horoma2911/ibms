<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBMS | Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="../assets/images/logo.svg" alt="IBMS logo" />
          <div>
            <h4 data-i18n="appName">IBMS</h4>
            <p data-i18n="appSubtitle">Integrated Business Management System</p>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i><span data-i18n="sidebar.dashboard">Dashboard</span></a>
          <a class="nav-link" href="products.html"><i class="fas fa-box-open"></i><span data-i18n="sidebar.products">Products</span></a>
          <a class="nav-link" href="inventory.html"><i class="fas fa-warehouse"></i><span data-i18n="sidebar.inventory">Inventory</span></a>
          <a class="nav-link active" href="sales.html"><i class="fas fa-cash-register"></i><span data-i18n="sidebar.sales">Sales</span></a>
          <a class="nav-link" href="purchases.html"><i class="fas fa-shopping-cart"></i><span data-i18n="sidebar.purchases">Purchases</span></a>
          <a class="nav-link" href="customers.html"><i class="fas fa-users"></i><span data-i18n="sidebar.customers">Customers</span></a>
          <a class="nav-link" href="suppliers.html"><i class="fas fa-truck"></i><span data-i18n="sidebar.suppliers">Suppliers</span></a>
          <a class="nav-link" href="employees.html"><i class="fas fa-user-tie"></i><span data-i18n="sidebar.employees">Employees</span></a>
          <a class="nav-link" href="attendance.html"><i class="fas fa-calendar-check"></i><span data-i18n="sidebar.attendance">Attendance</span></a>
          <a class="nav-link" href="payroll.html"><i class="fas fa-money-bill-wave"></i><span data-i18n="sidebar.payroll">Payroll</span></a>
          <a class="nav-link" href="reports.html"><i class="fas fa-chart-line"></i><span data-i18n="sidebar.reports">Reports</span></a>
          <a class="nav-link" href="settings.html"><i class="fas fa-cog"></i><span data-i18n="sidebar.settings">Settings</span></a>
        </nav>
      </aside>

      <div class="main-content">
        <header class="topbar">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" data-i18n-placeholder="topbar.searchPlaceholder" placeholder="Search modules, reports or staff" />
          </div>
          <div class="topbar-actions">
            <button class="btn btn-outline-primary"><i class="fas fa-bell"></i></button>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary" data-lang-switch="en">EN</button>
              <button class="btn btn-sm btn-outline-primary" data-lang-switch="sw">SW</button>
            </div>
            <div class="user-chip d-none">
              <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=80&q=80" alt="User" />
              <div>
                <div class="fw-bold">Amina K.</div>
                <small class="text-muted" data-i18n="topbar.profile">Operations Lead</small>
              </div>
            </div>
          </div>
        </header>

        <main class="page-content">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
              <h2 class="section-title mb-1" data-i18n="sales.heading">Sales & POS</h2>
              <p class="text-muted mb-0" data-i18n="sales.subtitle">Create fast sales orders, calculate totals and issue receipts.</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <button id="record-sale-btn" class="btn btn-success"><i class="fas fa-check-circle me-2"></i>Record Sale</button>
              <button id="generate-receipt-btn" class="btn btn-primary-custom"><i class="fas fa-receipt me-2"></i>Generate Receipt</button>
              <a href="sales-history.html" class="btn btn-outline-primary"><i class="fas fa-history me-2"></i>Sales History</a>
            </div>
          </div>

          <div class="row g-4">
            <div class="col-lg-8">
              <div class="panel-card">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Select Product</label>
                    <select id="sales-product-select" class="form-select">
                      <option value="">Loading products...</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Packaging</label>
                    <select id="sales-packaging-select" class="form-select">
                      <option value="">Select package</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" class="form-control" value="5" />
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Unit Price</label>
                    <input type="text" class="form-control" value="Tshs 290" />
                  </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button id="record-sale-inline" class="btn btn-success">Record Sale</button>
                </div>
              </div>
            </div>
              <!-- Cart/pos removed for private workflow: sales recorded directly -->
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/language.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/auth-login.js"></script>
    <script src="../assets/js/receipt-actions.js?v=20260909"></script>
    <script src="../assets/js/sales-receipt.js?v=20260909"></script>
  </body>
</html>
