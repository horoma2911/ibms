<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBMS | Suppliers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="../assets/images/logo.svg" alt="IBMS logo" />
          <div>
            <h4 data-i18n="appName">IBMS</h4>
            <p data-i18n="appSubtitle">Integrated Business Management System</p>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i><span data-i18n="sidebar.dashboard">Dashboard</span></a>
          <a class="nav-link" href="products.html"><i class="fas fa-box-open"></i><span data-i18n="sidebar.products">Products</span></a>
          <a class="nav-link" href="inventory.html"><i class="fas fa-warehouse"></i><span data-i18n="sidebar.inventory">Inventory</span></a>
          <a class="nav-link" href="sales.html"><i class="fas fa-cash-register"></i><span data-i18n="sidebar.sales">Sales</span></a>
          <a class="nav-link" href="purchases.html"><i class="fas fa-shopping-cart"></i><span data-i18n="sidebar.purchases">Purchases</span></a>
          <a class="nav-link" href="customers.html"><i class="fas fa-users"></i><span data-i18n="sidebar.customers">Customers</span></a>
          <a class="nav-link active" href="suppliers.html"><i class="fas fa-truck"></i><span data-i18n="sidebar.suppliers">Suppliers</span></a>
          <a class="nav-link" href="employees.html"><i class="fas fa-user-tie"></i><span data-i18n="sidebar.employees">Employees</span></a>
          <a class="nav-link" href="attendance.html"><i class="fas fa-calendar-check"></i><span data-i18n="sidebar.attendance">Attendance</span></a>
          <a class="nav-link" href="payroll.html"><i class="fas fa-money-bill-wave"></i><span data-i18n="sidebar.payroll">Payroll</span></a>
          <a class="nav-link" href="reports.html"><i class="fas fa-chart-line"></i><span data-i18n="sidebar.reports">Reports</span></a>
          <a class="nav-link" href="settings.html"><i class="fas fa-cog"></i><span data-i18n="sidebar.settings">Settings</span></a>
        </nav>
      </aside>

      <div class="main-content">
        <header class="topbar">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" data-i18n-placeholder="topbar.searchPlaceholder" placeholder="Search modules, reports or staff" />
          </div>
          <div class="topbar-actions">
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary" data-lang-switch="en">EN</button>
              <button class="btn btn-sm btn-outline-primary" data-lang-switch="sw">SW</button>
            </div>
          </div>
        </header>

        <main class="page-content">
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
              <h2 class="section-title mb-1" data-i18n="sidebar.suppliers">Suppliers</h2>
              <p class="text-muted mb-0">Track supplier contracts, deliveries and payment terms.</p>
            </div>
            <button class="btn btn-primary-custom" data-action="add" data-form-type="suppliers"><i class="fas fa-plus me-2"></i><span data-i18n="products.add">Add</span></button>
          </div>

          <div class="panel-card">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Company</th>
                    <th>Contact</th>
                    <th>Category</th>
                    <th>Lead Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="suppliers-table-body"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/language.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
