<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBMS | Sales History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="../assets/images/logo.svg" alt="IBMS logo" />
          <div>
            <h4>IBMS</h4>
            <p>Integrated Business Management System</p>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
          <a class="nav-link" href="products.html"><i class="fas fa-box-open"></i><span>Products</span></a>
          <a class="nav-link" href="inventory.html"><i class="fas fa-warehouse"></i><span>Inventory</span></a>
          <a class="nav-link active" href="sales.html"><i class="fas fa-cash-register"></i><span>Sales</span></a>
          <a class="nav-link" href="purchases.html"><i class="fas fa-shopping-cart"></i><span>Purchases</span></a>
          <a class="nav-link" href="customers.html"><i class="fas fa-users"></i><span>Customers</span></a>
          <a class="nav-link" href="suppliers.html"><i class="fas fa-truck"></i><span>Suppliers</span></a>
          <a class="nav-link" href="employees.html"><i class="fas fa-user-tie"></i><span>Employees</span></a>
          <a class="nav-link" href="reports.html"><i class="fas fa-chart-line"></i><span>Reports</span></a>
        </nav>
      </aside>

      <div class="main-content">
        <header class="topbar">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search sales" />
          </div>
          <div class="topbar-actions">
            <a href="sales.html" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-2"></i>Back to Sales</a>
          </div>
        </header>

        <main class="page-content">
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
              <h2 class="section-title mb-1">Sales History</h2>
              <p class="text-muted mb-0">List of all recorded sales and their totals.</p>
            </div>
          </div>

          <div class="panel-card">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th>Reference</th>
                    <th>Time</th>
                    <th>Payment</th>
                    <th>Total kg</th>
                    <th>Total Amount</th>
                    <th>Items</th>
                    <th>Receipt</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="sales-history-body"></tbody>
              </table>
            </div>
            <div id="sales-history-empty" class="text-muted py-4" hidden>No sales recorded yet.</div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/receipt-actions.js?v=20260909"></script>
    <script src="../assets/js/sales-history.js?v=20260909"></script>
  </body>
</html>
