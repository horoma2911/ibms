<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBMS Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      .kiosk-shell { display:flex; min-height:100vh; align-items:center; justify-content:center; background:var(--color-background); }
      .kiosk-card { width:100%; max-width:900px; background:var(--color-white); border-radius:20px; padding:28px; box-shadow: var(--shadow); }
      #qr-reader { width:100%; max-width:420px; margin:auto; }
      .kiosk-header { text-align:center; margin-bottom:18px; }
      .kiosk-message { font-size:1.25rem; font-weight:700; color:var(--color-primary); margin-top:12px; }
      .employee-display { display:flex; gap:12px; align-items:center; justify-content:center; margin-top:18px; }
    </style>
  </head>
  <body>
    <div class="kiosk-shell">
      <div class="kiosk-card">
        <div class="kiosk-header">
          <img src="../assets/images/logo.svg" alt="Company" style="width:96px;height:96px;" />
          <h2 data-i18n="kiosk.title">EMPLOYEE ATTENDANCE</h2>
          <div id="kiosk-message" class="kiosk-message" data-i18n="kiosk.scanPrompt">Scan your QR Code</div>
        </div>

        <div id="qr-reader"></div>

        <div class="employee-display" id="employee-info"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/language.js"></script>
    <script src="../assets/js/attendance-offline.js"></script>
    <script src="../assets/js/attendance.js"></script>
  </body>
</html>
