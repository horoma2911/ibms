<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBMS Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="login-banner">
      <div class="login-card">
        <div class="d-flex justify-content-end mb-3 gap-2">
          <button class="btn btn-sm btn-outline-primary" data-lang-switch="en">EN</button>
          <button class="btn btn-sm btn-outline-primary" data-lang-switch="sw">SW</button>
        </div>
        <div class="login-brand">
          <img src="assets/images/logo.svg" alt="IBMS logo" width="64" height="64" />
          <div>
            <h3 class="fw-bold mb-1" data-i18n="appName">IBMS</h3>
            <p class="text-muted mb-0" data-i18n="appSubtitle">Integrated Business Management System</p>
          </div>
        </div>
        <h2 class="text-center mb-2" data-i18n="login.welcome">Welcome Back</h2>
        <p class="text-center text-muted mb-4" data-i18n="login.subtitle">Access your business operations with confidence.</p>
        <form id="login-form">
          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" name="email" data-i18n-placeholder="login.username" placeholder="Email address" autocomplete="email" required />
            <label for="email" data-i18n="login.username">Username or Email</label>
          </div>
          <div class="form-floating mb-4">
            <input type="password" class="form-control" id="password" name="password" data-i18n-placeholder="login.password" placeholder="Password" autocomplete="current-password" required />
            <label for="password" data-i18n="login.password">Password</label>
          </div>
          <div id="login-feedback" class="alert d-none" role="alert" aria-live="polite"></div>
          <button id="login-submit" type="submit" class="btn btn-primary-custom w-100 py-2" data-i18n="login.loginButton">Login</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/language.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
